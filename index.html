<title>Office Besties</title>
<style>
:root{color-scheme:dark;--bg:#1a120d;--fg:#fff}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:system-ui,sans-serif}
svg{position:fixed;inset:0;width:100%;height:100%}
svg rect[width="1600"][height="900"]{pointer-events:none}
#guyhit{cursor:pointer}
.br{animation:br 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes br{50%{transform:scale(1.012,1.018)}}
.bl{animation:bl 5s infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.hd{animation:hd 6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes hd{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
.tl{animation:ty .34s ease-in-out infinite alternate}
.tr{animation:ty .34s ease-in-out .17s infinite alternate}
@keyframes ty{to{transform:translateY(3px)}}
.fw{animation:fw 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fw{50%{transform:rotate(4deg)}}
.hs{animation:hs 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes hs{50%{transform:rotate(2.5deg)}}
.tk{animation:tk 6s infinite both;transform-box:fill-box;transform-origin:50% 0;opacity:0}
@keyframes tk{0%{opacity:0;transform:scaleY(.1)}3%{opacity:1;transform:scaleY(1)}8%{transform:scaleY(.3)}13%{transform:scaleY(1)}18%{transform:scaleY(.4)}23%{transform:scaleY(.9)}28%{transform:scaleY(.3)}33%{transform:scaleY(1)}38%{transform:scaleY(.25)}42%{opacity:1;transform:scaleY(.8)}46%,100%{opacity:0;transform:scaleY(.1)}}
.sm{animation:sm 4.2s ease-out infinite both;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sm{0%{opacity:0;transform:translate(0,4px) scale(.7)}15%{opacity:.6}100%{opacity:0;transform:translate(5px,-18px) scale(1.25)}}
.pk{animation:pk 5s ease-in-out infinite}
@keyframes pk{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.lk{animation:lk 7s ease-in-out infinite}
@keyframes lk{0%,25%,100%{transform:translateX(0)}35%,55%{transform:translateX(-2.5px)}65%,85%{transform:translateX(2px)}}
.bw{animation:bw 6s ease-in-out infinite}
@keyframes bw{0%,60%,100%{transform:translateY(0)}68%,76%{transform:translateY(-2.5px)}}
.br2{animation:br2 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes br2{50%{transform:scale(1.02,1.07)}}
.zz{animation:zz 4s ease-out infinite both;transform-box:fill-box;transform-origin:0 100%}
@keyframes zz{0%{opacity:0;transform:translate(0,6px) scale(.6)}20%{opacity:.95}100%{opacity:0;transform:translate(-14px,-40px) scale(1.3)}}
.gl{animation:gl 5s ease-in-out infinite}
@keyframes gl{0%,100%{opacity:.7}45%{opacity:1}50%{opacity:.8}70%{opacity:.95}}
.sy{animation:sy 7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sy{50%{transform:rotate(1.6deg)}}
#girlhit{cursor:pointer}
#gunHN.hold .fg{visibility:hidden}
#girlRhit{cursor:pointer}
#faceR .altf{display:none}
#faceR.on .altf{display:inline;animation:sly .3s ease-out both}
#faceR.on .bl,#faceR.on .brw,#faceR.on .lp,#faceR.on .tk{visibility:hidden}
#girlR.bald .hr,#girlR.bald .hs{visibility:hidden}
#girlR .shn{display:none}
#girlR.bald .shn{display:inline}
#tcl2{transform-box:fill-box;transform-origin:10% 100%}
#catHit{cursor:pointer}
#catG.awake .ce,#catG.awake .zz{display:none}
#catG .aw{display:none}
#catG.awake .aw{display:inline}
#catG.yawn .ey{display:none}
#catG.yawn .ce{display:inline}
.mw{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(.04)}
#catBi{transform-box:fill-box;transform-origin:10% 100%}
#faceL .altf{display:none}
#faceL.on .altf{display:inline}
#faceL.on .bl,#faceL.on .brw,#faceL.on .lp,#faceL.on .tk{visibility:hidden}
#faceL.on .altf{animation:sly .5s ease-out both}
@keyframes sly{from{opacity:0}to{opacity:1}}
.td,#tcl{transform-box:fill-box;transform-origin:50% 50%}
#doorhit{cursor:pointer}
.mE{transform-box:fill-box;transform-origin:50% 50%}
.mP,.mB{transition:transform .2s ease-out}
#mbi{transform-box:fill-box;transform-origin:18% 100%}
#curthit{cursor:pointer}
#footHit{cursor:pointer}
#faceL.ang .bl,#faceL.ang .brw,#faceL.ang .lp,#faceL.ang .tk{visibility:hidden}
#sockW{transform-box:view-box;transform-origin:-3px -6px}
.ft{transform-box:view-box;transform-origin:360px 16px;animation:ft 3.4s ease-in-out infinite}
@keyframes ft{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4.5deg)}}
.ft.kick{animation:fk .95s ease-in-out}
@keyframes fk{0%{transform:rotate(-4deg)}18%{transform:rotate(22deg)}40%{transform:rotate(-20deg)}62%{transform:rotate(14deg)}82%{transform:rotate(-8deg)}100%{transform:rotate(-4deg)}}
.pl{animation:pl 4.6s ease-in infinite both;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pl{0%{opacity:0;transform:translate(0,0) rotate(0)}8%{opacity:1}100%{opacity:0;transform:translate(var(--dx,6px),110px) rotate(200deg)}}
</style>

  ${dz?'<path d="M-11.5,-4.5L-5.5,1.5M-5.5,-4.5L-11.5,1.5M5.5,-4.5L11.5,1.5M11.5,-4.5L5.5,1.5" stroke="#3a1e0e" stroke-width="1.9" stroke-linecap="round"/>':''}
  <path d="M-1.5,-3Q0,-4.6 1.5,-3M-15.5,-3L-19.5,-2.5M15.5,-3L19.5,-2.5" stroke="#0d0d10" stroke-width="2.2" fill="none" stroke-linecap="round"/>

 const eO=x=>1-Math.pow(1-x,3),eB=x=>{x-=1;return 1+2.70158*x*x*x+1.70158*x*x};
 // after the crash he lies rotated ~90deg: build both arms from the shoulders, with directions given in SCREEN degrees (0 = up, clockwise)
 const dzArms=(t,P)=>{const R=(P.rot||0)*Math.PI/180,c=Math.cos(R),s=Math.sin(R),up=P.up||0,
  v=(deg,len)=>{const a=deg*Math.PI/180,x=Math.sin(a)*len,y=-Math.cos(a)*len;return[x*c+y*s,-x*s+y*c]},
  arm=(sx,sy,a1,a2,l1,l2,fing)=>{const[ex,ey]=v(a1,l1),elx=sx+ex,ely=sy+ey,[fx,fy]=v(a2,l2),hx=elx+fx,hy=ely+fy;let f='';
   if(fing)for(const d of[-34,-12,10,32]){const[gx,gy]=v(a2+d,12);f+=`<path d="M${f1(hx)},${f1(hy)}l${f1(gx)},${f1(gy)}" stroke="${sk}" stroke-width="3.6" stroke-linecap="round"/>`}
   return`<path d="M${sx},${sy}L${f1(elx)},${f1(ely)}" stroke="${shirt}" stroke-width="14.5" stroke-linecap="round"/><path d="M${f1(elx)},${f1(ely)}L${f1(hx)},${f1(hy)}" stroke="${sk}" stroke-width="9" stroke-linecap="round"/>${f}<circle cx="${f1(hx)}" cy="${f1(hy)}" r="6.4" fill="${sk}"/>`},
  w=14*Math.sin(t/170);

 // mode 0 = bike+rider together (riding), 1 = bike only, 2 = rider only (after he's thrown off). P = {ped, wheel, fl (flailing), dz (dazed)}
 const rider=(t,X,mode,P)=>{P=P||{};
  const ped=P.ped===undefined?X/26:P.ped,wv=Math.sin(t/(P.fl?45:150)),phi=(-8+30*wv)*Math.PI/180,Ex=-48,Ey=-134,Hx=Ex+25*Math.sin(phi),Hy=Ey-25*Math.cos(phi),
   fing=[-34,-12,10,32].map(d=>{const q=phi+d*Math.PI/180;return`<path d="M${f1(Hx)},${f1(Hy)}L${f1(Hx+11.5*Math.sin(q))},${f1(Hy-11.5*Math.cos(q))}" stroke="${sk}" stroke-width="3.6" stroke-linecap="round"/>`}).join(''),

    :`<path d="M17,-120L35,-102" stroke="${shirt}" stroke-width="14.5" stroke-linecap="round"/><path d="M35,-102L46,-82" stroke="${sk}" stroke-width="9" stroke-linecap="round"/><circle cx="47" cy="-80" r="5.6" fill="${sk}"/>`,
   body=`<path d="M-31,-74Q-38,-100 -28,-124Q-5,-134 19,-124Q30,-100 11,-74Z" fill="${shirt}"/><path d="M11,-74Q30,-100 19,-124Q12,-100 0,-74Z" fill="${shirtD}" opacity=".5"/>

 const banner=(t,tipX,tipY,amp)=>{const L=150,H=40,N=22,P=s=>{const w=5*amp*s*Math.sin(s*9-t/140);return[tipX-s*L,tipY+10*amp*s*s+w]},hh=s=>H/2*(1-.1*s);
  let top='',bot='',txt='';
  for(let i=0;i<=N;i++){const s=i/N,[x,y]=P(s);top+=`${f1(x)},${f1(y-hh(s))} `;bot=`${f1(x)},${f1(y+hh(s))} `+bot}
  const[ex,ey]=P(1);bp.setAttribute('points',top+`${f1(ex+16)},${f1(ey)} `+bot);
  for(let i=0;i<=16;i++){const s=.9-i/16*.78,[x,y]=P(s);txt+=(i?'L':'M')+f1(x)+','+f1(y+8.5)+' '}
  tp.setAttribute('d',txt);
  pole.setAttribute('x1',f1(tipX));pole.setAttribute('x2',f1(tipX));pole.setAttribute('y1',f1(tipY-H/2-4));pole.setAttribute('y2',f1(tipY+H/2+4))};
 const tie=(ax,ay,tipX,tipY)=>{const cx=(ax+tipX)/2+6,cy=(ay+tipY)/2+10;
  str.innerHTML=`<path d="M${f1(ax)},${f1(ay)}Q${f1(cx)},${f1(cy)} ${f1(tipX)},${f1(tipY-22)}"/><path d="M${f1(ax)},${f1(ay)}Q${f1(cx)},${f1(cy+8)} ${f1(tipX)},${f1(tipY+22)}"/>`};
 // ---- the wreck: he rides into a cone at TC, goes over the bars, face-plants at LX, and the banner flutters down onto him ----
 const sh=$('#kSh'),cone=$('#kCone'),rid=$('#kRid'),hand=$('#kHand'),stars=$('#kStars'),pow=$('#kPow');
 const TC=2900,XC=1280,CX=XC+54,TF=850,LX=XC+150,LY=G-10,TX=LX+40,GR=1400,tip0X=XC-80,tip0Y=208+3*Math.sin(TC/430);
 let post=0;
 const frame_=t=>{
  const o=eIO(sg(t,0,900)),c=eIO(sg(t,T-800,T)),k=1-.73*o*(1-c);
  LP.setAttribute('transform',`translate(960 0) scale(${k.toFixed(3)} 1) translate(-960 0)`);
  RP.setAttribute('transform',`translate(1600 0) scale(${k.toFixed(3)} 1) translate(-1600 0)`);
  cl.setAttribute('transform',`translate(${f1(t*.012)} 0)`);
  if(t<TC){
   if(post){post=0;rid.innerHTML='';stars.innerHTML='';hand.innerHTML='';pow.style.display='none';str.style.opacity=1;ban.removeAttribute('transform');sh.setAttribute('rx',0)}
   const u=sg(t,600,TC),X=X0+(XC-X0)*(u+.06*Math.sin(TAU*u)),bob=.8*Math.sin(t/95);
   bike.setAttribute('transform',`translate(${f1(X)} ${f1(G+bob)}) scale(${S})`);bike.innerHTML=rider(t,X,0);
   cone.setAttribute('transform',`translate(${CX} ${G}) scale(.9)`);
   const tipX=X-80,tipY=208+3*Math.sin(t/430);
   banner(t,tipX,tipY,1);tie(X-12*S,G-74*S+bob,tipX,tipY);return}
  post=1;const tau=t-TC;
  // bike: nose-dives over the cone (pivot = front tyre), wobbles, slams back down and rolls to a stop
  const a=tau<420?64*eB(sg(tau,0,420)):tau<1100?64+5*Math.sin((tau-420)/55)*(1-sg(tau,420,1100)):tau<1450?64*(1-Math.pow(sg(tau,1100,1450),2)):8*Math.sin(Math.PI*sg(tau,1450,1750));

  bike.innerHTML=rider(t,XC,1,{ped:XC/26,wheel:XC/(30*S)+tau*.01*(1-.8*sg(tau,0,3200))});
  const ar=a*Math.PI/180,px=52*S,dx=-12*S-px,dy=-74*S,sx=bx+px+dx*Math.cos(ar)-dy*Math.sin(ar),sy=G+dx*Math.sin(ar)+dy*Math.cos(ar);

  rid.setAttribute('transform',`translate(${f1(rx)} ${f1(ry)}) rotate(${f1(rot)}) scale(${S}) translate(10 75)`);
  rid.innerHTML=rider(t,XC,2,{ped:XC/26+ts*1000/55,fl:tau<TF,dz:tau>=TF,rot:rot,up:eO(sg(tau,3300,3700))});
  sh.setAttribute('cx',f1(rx));sh.setAttribute('cy',G+4);sh.setAttribute('rx',f1(Math.max(16,40-Math.max(0,LY-ry)*.12)));

  if(tau<900){const s2=(tau<220?eB(sg(tau,0,220)):1)*1.15;pow.style.display='';pow.style.opacity=1-sg(tau,650,900);pow.setAttribute('transform',`translate(${XC+58} ${G-62}) scale(${f1(s2)})`)}else pow.style.display='none';

   stars.style.opacity=Math.min(1,sg(tau,TF+80,TF+300))*(1-sg(t,T-1300,T-800));
   stars.innerHTML=[0,1,2].map(i=>{const th=t/230+i*TAU/3;return`<polygon points="0,-6 1.8,-1.8 6,0 1.8,1.8 0,6 -1.8,1.8 -6,0 -1.8,-1.8" transform="translate(${f1(hx+20*Math.cos(th))} ${f1(hy-24+6*Math.sin(th))}) rotate(${f1(t/5+i*40)})" fill="#ffd93b" stroke="#c99a10" stroke-width="1"/>`}).join('')}
  hand.innerHTML=''
 };
 let busy=0;
 hit.addEventListener('click',()=>{if(busy)return;busy=1;fx.style.display='';showStatic(0);frame_(0);
  let lastF=0;const t0=performance.now(),tick=n=>{const t=n-t0;if(t>=T){fx.style.display='none';showStatic(1);busy=0;return}if(t-lastF>=30||t>T-60){lastF=t;frame_(t)}requestAnimationFrame(tick)};

// ---- little boy's foot through the ceiling: click -> he kicks, his sneaker flies off and bonks the left girl ----
{const hit=$('#footHit'),ft=$('#foot'),shoeOn=$('#shoeOn'),sockPos=$('#sockPos'),sockW=$('#sockW'),face=$('#faceL'),
  fly=$('#shoeFly'),flyI=$('#shoeFlyI'),bonk=$('#bonk'),bonkI=$('#bonkI'),stars=$('#stars'),starsR=$('#starsR');
 // perf: the flying shoe, bonk and stars move every frame; give them their own layer in front of the room instead of repainting the whole room svg
 {const room=fly.ownerSVGElement,front=room.cloneNode(false);front.id='fxFront';front.setAttribute('aria-hidden','true');front.style.cssText='pointer-events:none;will-change:transform';room.after(front);front.append(fly,bonk,stars)}
 flyI.innerHTML=shoeOn.innerHTML;
 const skin='#f1c9a5',eye=x=>{const k=x<0?-1:1;
  return`<path d="M${x-11},330Q${x},320 ${x+11},330Q${x},340 ${x-11},330Z" fill="#fff"/><circle cx="${x-3}" cy="328.5" r="5.4" fill="#4a8fd6" stroke="#2b4f7a" stroke-width="1"/><circle cx="${x-3}" cy="328" r="2.7" fill="#10131a"/><circle cx="${x-1.5}" cy="326" r="1.4" fill="#fff"/>
  <polygon points="${x-14*k},316 ${x+14*k},316 ${x+14*k},331 ${x-14*k},322" fill="${skin}"/><path d="M${x-13*k},322L${x+13*k},330" stroke="#2b1a1a" stroke-width="2.4" stroke-linecap="round"/><path d="M${x-9},334Q${x},339 ${x+9},334" stroke="#00000022" stroke-width="1.5" fill="none"/>`};
 face.insertAdjacentHTML('beforeend',`<g id="annL" style="display:none">${eye(-24)}${eye(24)}
  <path d="M-41,298L-10,312M41,298L10,312" stroke="#8f1d14" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M-15,378Q0,366 15,378" stroke="#c9605a" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M-17,380L-14,376M17,380L14,376" stroke="#8f3a35" stroke-width="2" stroke-linecap="round"/>
  <g stroke="#d83a3a" stroke-width="2.6" fill="none" stroke-linecap="round"><path d="M38,278Q42,280 42,284M50,278Q46,280 46,284M38,290Q42,288 42,284M50,290Q46,288 46,284"/></g>
  <ellipse cx="-17" cy="242" rx="12" ry="9" fill="#f0a08e" stroke="#c9605a" stroke-width="1.5"/><ellipse cx="-20" cy="239" rx="4" ry="2.4" fill="#fff" opacity=".7"/></g>`);
 const ann=$('#annL');let busy=0;
 const thud=()=>{face.classList.add('ang');ann.style.display='';
  face.animate([{transform:'scaleY(1)'},{transform:'scale(1.05,.92)',offset:.4},{transform:'scaleY(1)'}],{duration:300,easing:'ease-out'});
  bonk.style.display='';bonkI.animate([{transform:'scale(0) rotate(-20deg)',opacity:0},{transform:'scale(1.2) rotate(6deg)',opacity:1,offset:.45},{transform:'scale(1) rotate(0)',opacity:1,offset:.8},{transform:'scale(1)',opacity:0}],{duration:1100,fill:'forwards'}).onfinish=()=>{bonk.style.display='none'};
  stars.style.display='';starsR.animate([{transform:'rotate(0deg)'},{transform:'rotate(720deg)'}],{duration:1500,easing:'ease-out'}).onfinish=()=>{stars.style.display='none'};
  setTimeout(()=>{face.classList.remove('ang');ann.style.display='none'},3200)};
 hit.addEventListener('click',()=>{if(busy)return;busy=1;document.documentElement.dataset.shoe=1;face.classList.remove('on');ft.classList.add('kick');
  document.querySelectorAll('.pl').forEach((e,i)=>e.animate([{opacity:0,transform:'translate(0,0) rotate(0)'},{opacity:1,offset:.1},{opacity:0,transform:`translate(${(i-1)*14}px,95px) rotate(${160+i*40}deg)`}],{duration:900+i*200,easing:'ease-in'}));
  setTimeout(()=>ft.classList.remove('kick'),1000);
  setTimeout(()=>{ // the sneaker comes off and flies at her head
   shoeOn.style.display='none';sockPos.style.display='';
   sockW.animate([{transform:'rotate(-14deg)'},{transform:'rotate(14deg)'}],{duration:170,iterations:18,direction:'alternate',easing:'ease-in-out'});
   fly.style.display='';
   let x=383,y=76,vx=138,vy=-55,r=55,w=480,hitDone=0,rest=0,last=performance.now();const GR=1500,GY=858;
   const place=()=>fly.setAttribute('transform',`translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${r.toFixed(1)}) scale(1.15)`);place();
   const step=n=>{const dt=Math.min(.033,(n-last)/1000);last=n;vy+=GR*dt;x+=vx*dt;y+=vy*dt;r+=w*dt;
    if(!hitDone&&x>=438&&y>=226){hitDone=1;vx=95;vy=-300;w=720;thud()}
    if(hitDone&&y>=GY){y=GY;if(Math.abs(vy)>70){vy=-vy*.38;vx*=.65;w*=.5}else{vy=0;vx*=.9;w*=.7;if(Math.abs(vx)<6)rest=1}}
    place();if(!rest)requestAnimationFrame(step)};
   requestAnimationFrame(step)},380);

  setTimeout(()=>{fly.style.display='none';fly.getAnimations().forEach(a=>a.cancel());shoeOn.style.display='';sockPos.style.display='none';busy=0;delete document.documentElement.dataset.shoe},8200)})}

// ---- perf: ambient loops (breathing, blinking, typing, glow, talking gestures) don't need 60fps. One driver steps each loop only as often as it needs:
// slow loops (breathing, sway, glow, smoke - cycles of 2s+) at ~8Hz, fast ones (typing) at ~16Hz, so the big SVG is repainted far less often.
// The rates stay the same the whole time: the room never freezes or slows down when you click the shoe, the curtain or anything else.
// The foot's kick is left alone so it runs at full smoothness.
{const m=new WeakMap();let last=0;
 const dur=a=>{try{const d=a.effect.getTiming().duration;return typeof d==='number'?d:1e4}catch(_){return 1e4}};
 const tick=n=>{requestAnimationFrame(tick);
  if(n-last<30)return;last=n;
  for(const a of document.getAnimations()){if(!(a instanceof CSSAnimation)&&a.id!=='amb')continue;
   let o=m.get(a);
   if(o===undefined){
    if(a.animationName==='fk'){m.set(a,null);continue}
    m.set(a,{t0:n-(a.currentTime||0),u:n,st:dur(a)<1000?60:125});a.pause();continue}
   if(o===null||n-o.u<o.st)continue;
   o.u=n;a.currentTime=n-o.t0}};
 requestAnimationFrame(tick)}
